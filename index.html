<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pijnkaart</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a2e; color: #fff;
    height: 100dvh; display: flex; flex-direction: column;
    overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: #16213e;
    border-bottom: 1px solid #0f3460; flex-shrink: 0; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 0.95rem; font-weight: 700; color: #e94560; letter-spacing: 0.06em; white-space: nowrap; }
  .sep { width: 1px; height: 22px; background: #0f3460; margin: 0 2px; flex-shrink: 0; }
  .name-input {
    height: 28px; padding: 0 10px; border-radius: 14px;
    border: 1px solid #0f3460; background: #1a1a2e; color: #fff;
    font-size: 0.8rem; min-width: 100px; flex: 1; max-width: 180px;
    outline: none; transition: border-color 0.15s;
  }
  .name-input:focus { border-color: #e94560; }
  .name-input::placeholder { color: #555; }
  .sz-btn {
    border-radius: 50%; border: 2px solid #0f3460; background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: border-color 0.15s;
  }
  .sz-btn.active { border-color: #e94560; }
  .sz-dot { border-radius: 50%; background: #666; }
  .sz-btn.active .sz-dot { background: #e94560; }
  .tool-btn {
    height: 28px; padding: 0 10px; border-radius: 14px;
    border: 1px solid #0f3460; background: transparent; color: #888;
    font-size: 0.72rem; font-weight: 500; cursor: pointer;
    white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
  }
  .tool-btn:hover { border-color: #e94560; color: #e94560; }
  .tool-btn.active { border-color: #e94560; background: #2a0a1e; color: #e94560; }
  .tool-btn:disabled { opacity: 0.3; cursor: default; }
  .save-btn {
    height: 28px; padding: 0 14px; border-radius: 14px; border: none;
    background: #e94560; color: #fff; font-size: 0.75rem; font-weight: 700;
    cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: background 0.15s;
  }
  .save-btn:disabled { background: #555; cursor: default; }
  .save-btn:not(:disabled):active { transform: scale(0.96); }
  .dl-btn {
    height: 28px; width: 28px; border-radius: 14px;
    border: 1px solid #0f3460; background: transparent;
    color: #888; font-size: 0.85rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s; padding: 0;
  }
  .dl-btn:hover { border-color: #aaa; color: #fff; }
  .dl-btn:active { transform: scale(0.93); }
  .viewport {
    flex: 1; position: relative; overflow: hidden;
    background: #f0f0f0; touch-action: none;
  }
  #zoomWrap { position: absolute; transform-origin: 0 0; cursor: crosshair; }
  #zoomWrap img { display: block; -webkit-user-drag: none; user-select: none; pointer-events: none; }
  #paintCanvas { position: absolute; top: 0; left: 0; touch-action: none; cursor: crosshair; }
  .zoom-pill {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(22,33,62,0.85); color: #aaa;
    font-size: 0.65rem; padding: 3px 8px; border-radius: 10px; pointer-events: none;
  }
  .toast {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: #222; color: #fff; font-size: 0.82rem; font-weight: 500;
    padding: 10px 20px; border-radius: 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .toast.ok   { background: #1a6e35; }
  .toast.err  { background: #7a1a1a; }
  .toast.info { background: #1a3a6e; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Pijnkaart</h1>
  <div class="sep"></div>
  <input class="name-input" id="patName" type="text" placeholder="Naam patiënt…">
  <div class="sep"></div>
  <div style="display:flex;gap:5px;align-items:center">
    <button class="sz-btn active" style="width:22px;height:22px" onclick="setSize(4,this)"><span class="sz-dot" style="width:4px;height:4px"></span></button>
    <button class="sz-btn" style="width:26px;height:26px" onclick="setSize(12,this)"><span class="sz-dot" style="width:10px;height:10px"></span></button>
    <button class="sz-btn" style="width:30px;height:30px" onclick="setSize(24,this)"><span class="sz-dot" style="width:18px;height:18px"></span></button>
  </div>
  <div class="sep"></div>
  <button class="tool-btn active" id="btnDraw" onclick="setTool('draw')">✏️ Tekenen</button>
  <button class="tool-btn" id="btnErase" onclick="setTool('erase')">🧹 Gum</button>
  <button class="tool-btn" id="btnUndo" onclick="undo()" disabled>↩ Ongedaan</button>
  <button class="tool-btn" onclick="clearAll()" style="color:#e94560;border-color:#3a1020">🗑 Wissen</button>
  <button class="tool-btn" onclick="resetZoom()">🔍 Reset</button>
  <div class="sep"></div>
  <button class="save-btn" id="saveBtn" onclick="saveToDrive()">💾 Opslaan</button>
  <button class="dl-btn" id="dlBtn" onclick="saveLocal()" title="Lokaal opslaan">⬇</button>
</div>

  </div>
  <div class="zoom-pill" id="zoomPill">100%</div>
  <div class="toast" id="toast"></div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhRKxl1d2AI12-nktVdBK9ypITjRRD1c7G7PPVBQu6PbsDgitNB2rpzKR2EaAswC7KNQ/exec";

const viewport = document.getElementById("viewport");
const zoomWrap = document.getElementById("zoomWrap");
const img      = document.getElementById("bodyImg");
const canvas   = document.getElementById("paintCanvas");
const ctx      = canvas.getContext("2d");
const zoomPill = document.getElementById("zoomPill");
const btnUndo  = document.getElementById("btnUndo");
const saveBtn  = document.getElementById("saveBtn");
const toast    = document.getElementById("toast");

const dpr = window.devicePixelRatio || 1;
let tool = "draw", brushSize = 4;
const RED = "rgba(210,30,30,0.82)";
let scale = 1, panX = 0, panY = 0, fitScale = 1;
const MAX_SCALE = 8;
let drawing = false;

// ── Undo ──────────────────────────────────────────────────────────────────────
const undoStack = [];
function saveSnapshot() {
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (undoStack.length > 20) undoStack.shift();
  btnUndo.disabled = false;
}
function undo() {
  if (!undoStack.length) return;
  ctx.putImageData(undoStack.pop(), 0, 0);
  btnUndo.disabled = undoStack.length === 0;
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type) {
  toast.textContent = msg;
  toast.className = "toast show " + (type || "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.className = "toast"; }, 4000);
}

// ── Layout / resize-safe ──────────────────────────────────────────────────────
let savedPixels = null;
let canvasLogicalW = 0, canvasLogicalH = 0;

function initLayout(restorePixels) {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const iw = img.naturalWidth,     ih = img.naturalHeight;
  fitScale = Math.min(vw / iw, vh / ih);
  scale    = fitScale;
  panX = (vw - iw * scale) / 2;
  panY = (vh - ih * scale) / 2;
  const newW = iw * dpr, newH = ih * dpr;
  if (canvas.width !== newW || canvas.height !== newH) {
    canvas.width = newW; canvas.height = newH;
    ctx.scale(dpr, dpr);
  }
  canvasLogicalW = iw; canvasLogicalH = ih;
  if (restorePixels && savedPixels) ctx.putImageData(savedPixels, 0, 0);
  canvas.style.width  = iw + "px"; canvas.style.height = ih + "px";
  img.style.width     = iw + "px"; img.style.height    = ih + "px";
  applyTransform();
}

img.onload = () => initLayout(false);
if (img.complete && img.naturalWidth) initLayout(false);

let resizeTimer;
window.addEventListener("resize", () => {
  if (canvas.width > 0 && canvas.height > 0)
    savedPixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => initLayout(true), 100);
});

function applyTransform() {
  zoomWrap.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
  zoomPill.textContent = Math.round(scale * 100) + "%";
}
function clampPan() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const iw = img.naturalWidth * scale, ih = img.naturalHeight * scale, m = 30;
  panX = Math.min(vw-m, Math.max(m-iw, panX));
  panY = Math.min(vh-m, Math.max(m-ih, panY));
}
function resetZoom() { initLayout(true); }

function viewToCanvas(cx, cy) {
  const r = viewport.getBoundingClientRect();
  return { x: (cx - r.left - panX) / scale, y: (cy - r.top - panY) / scale };
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function beginStroke(cx, cy) { saveSnapshot(); ctx.beginPath(); ctx.moveTo(cx, cy); }
function continueStroke(cx, cy) {
  ctx.lineWidth = brushSize; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (tool === "erase") { ctx.globalCompositeOperation = "destination-out"; ctx.strokeStyle = "rgba(0,0,0,1)"; }
  else { ctx.globalCompositeOperation = "source-over"; ctx.strokeStyle = RED; }
  ctx.lineTo(cx, cy); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx, cy);
}

// ── Touch ─────────────────────────────────────────────────────────────────────
let lpd=null,lpmx=null,lpmy=null,gm=null;
function td(a,b){return Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);}
function tm(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};}

viewport.addEventListener("touchstart",e=>{
  e.preventDefault();const n=e.touches.length;
  if(n===1&&gm!=="pinch"){gm="draw";drawing=true;const c=viewToCanvas(e.touches[0].clientX,e.touches[0].clientY);beginStroke(c.x,c.y);}
  else if(n>=2){if(drawing){drawing=false;ctx.beginPath();}gm="pinch";lpd=td(e.touches[0],e.touches[1]);const m=tm(e.touches[0],e.touches[1]);lpmx=m.x;lpmy=m.y;}
},{passive:false});

viewport.addEventListener("touchmove",e=>{
  e.preventDefault();const n=e.touches.length;
  if(gm==="pinch"&&n>=2){
    const dist=td(e.touches[0],e.touches[1]),mid=tm(e.touches[0],e.touches[1]);
    if(lpd){const ns=Math.min(MAX_SCALE,Math.max(fitScale,scale*dist/lpd));const vr=viewport.getBoundingClientRect();const mx=mid.x-vr.left,my=mid.y-vr.top;panX=mx-(mx-panX)*(ns/scale);panY=my-(my-panY)*(ns/scale);scale=ns;}
    if(lpmx!==null){panX+=mid.x-lpmx;panY+=mid.y-lpmy;}
    lpd=dist;lpmx=mid.x;lpmy=mid.y;clampPan();applyTransform();
  }else if(gm==="draw"&&drawing&&n===1){const c=viewToCanvas(e.touches[0].clientX,e.touches[0].clientY);continueStroke(c.x,c.y);}
},{passive:false});

viewport.addEventListener("touchend",e=>{
  e.preventDefault();
  if(e.touches.length<2){lpd=null;lpmx=null;lpmy=null;}
  if(e.touches.length===0){drawing=false;gm=null;ctx.beginPath();}
  else if(e.touches.length===1&&gm==="pinch"){gm=null;drawing=false;ctx.beginPath();}
},{passive:false});

viewport.addEventListener("mousedown",e=>{if(e.button!==0)return;drawing=true;const c=viewToCanvas(e.clientX,e.clientY);beginStroke(c.x,c.y);});
viewport.addEventListener("mousemove",e=>{if(!drawing)return;const c=viewToCanvas(e.clientX,e.clientY);continueStroke(c.x,c.y);});
viewport.addEventListener("mouseup",()=>{drawing=false;ctx.beginPath();});
viewport.addEventListener("mouseleave",()=>{drawing=false;ctx.beginPath();});
viewport.addEventListener("wheel",e=>{
  e.preventDefault();
  const ns=Math.min(MAX_SCALE,Math.max(fitScale,scale*(e.deltaY<0?1.12:0.89)));
  const vr=viewport.getBoundingClientRect();const mx=e.clientX-vr.left,my=e.clientY-vr.top;
  panX=mx-(mx-panX)*(ns/scale);panY=my-(my-panY)*(ns/scale);scale=ns;clampPan();applyTransform();
},{passive:false});

// ── Controls ──────────────────────────────────────────────────────────────────
function setSize(s,btn){brushSize=s;document.querySelectorAll(".sz-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");}
function setTool(t){tool=t;document.getElementById("btnDraw").classList.toggle("active",t==="draw");document.getElementById("btnErase").classList.toggle("active",t==="erase");}

function clearAll() {
  if (confirm("Alle pijnaanduidingen en naam wissen?")) {
    saveSnapshot();
    ctx.clearRect(0, 0, canvasLogicalW, canvasLogicalH);
    document.getElementById("patName").value = "";
    savedPixels = null;
  }
}

// ── Build export ──────────────────────────────────────────────────────────────
function buildExport() {
  const iw=img.naturalWidth, ih=img.naturalHeight;
  const headerH=Math.round(ih*0.05), pad=Math.round(headerH*0.2), fs=Math.round(headerH*0.52);
  const name=document.getElementById("patName").value.trim()||"pijnkaart";
  const off=document.createElement("canvas");
  off.width=iw*dpr; off.height=(ih+headerH)*dpr;
  const oc=off.getContext("2d"); oc.scale(dpr,dpr);
  oc.fillStyle="#fff"; oc.fillRect(0,0,iw,headerH);
  oc.fillStyle="#ddd"; oc.fillRect(0,headerH-1,iw,1);
  oc.font=`bold ${fs}px -apple-system,Arial,sans-serif`;
  oc.fillStyle="#222"; oc.textBaseline="middle";
  oc.fillText("Patiënt: "+name, pad, headerH/2);
  const ds=new Date().toLocaleDateString("nl-BE",{day:"2-digit",month:"2-digit",year:"numeric"});
  const smallFs=Math.round(fs*0.78);
  oc.font=`${smallFs}px -apple-system,Arial,sans-serif`;
  oc.fillStyle="#888"; oc.textBaseline="middle";
  oc.fillText(ds, iw-pad-oc.measureText(ds).width, headerH/2);
  oc.fillStyle="#fff"; oc.fillRect(0,headerH,iw,ih);
  oc.drawImage(img,0,headerH,iw,ih);
  oc.drawImage(canvas,0,headerH,iw,ih);
  return {dataUrl:off.toDataURL("image/png"), name};
}

// ── Save to Drive ─────────────────────────────────────────────────────────────
async function saveToDrive() {
  const name = document.getElementById("patName").value.trim();
  if (!name) { showToast("⚠️ Vul eerst een naam in", "err"); return; }
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === "JOUW_APPS_SCRIPT_URL") {
    showToast("⚠️ Apps Script URL niet ingesteld", "err"); return;
  }
  saveBtn.disabled = true; saveBtn.textContent = "⏳ Bezig…";
  showToast("📤 Opslaan…", "info");
  const {dataUrl, name: nm} = buildExport();
  try {
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: nm, image: dataUrl})
    });
    showToast("✅ Opgeslagen naar kine!", "ok");
  } catch(err) {
    showToast("❌ Verbindingsfout — probeer opnieuw", "err");
  }
  saveBtn.disabled = false; saveBtn.textContent = "💾 Opslaan";
}

// ── Local download ────────────────────────────────────────────────────────────
function saveLocal() {
  const name = document.getElementById("patName").value.trim() || "pijnkaart";
  const {dataUrl} = buildExport();
  const now = new Date();
  const dateStr = now.toLocaleDateString("nl-BE",{day:"2-digit",month:"2-digit",year:"numeric"}).replace(/\//g,"-");
  const a = document.createElement("a");
  a.download = name.replace(/\s+/g,"_") + "_" + dateStr + ".png";
  a.href = dataUrl; a.click();
  showToast("⬇️ Opgeslagen in downloads", "ok");
}
</script>
